# Neural Farm on Termux (Pixel only: adapter -> 127.0.0.1:8889)
litellm_settings:
  request_timeout: 600
  drop_params: true

model_list:
  - model_name: openai
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 600
  - model_name: gpt-4o
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 600
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 600
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 600
  - model_name: cluster-model
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 600
