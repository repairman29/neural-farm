# Neural Farm — Pixel only (dev: predictable single node, no iPhone)
# Use: litellm --config config-dev-pixel-only.yaml --port 4000

litellm_settings:
  request_timeout: 300

model_list:
  - model_name: openai
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 300
  - model_name: gpt-4o
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 300
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 300
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 300
  - model_name: cluster-model
    litellm_params:
      model: openai/gemma
      api_base: http://localhost:8888/v1
      api_key: "sk-local-farm"
      timeout: 300
